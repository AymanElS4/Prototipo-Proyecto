<svg xmlns="http://www.w3.org/2000/svg" width="600" height="420" viewBox="0 0 600 420">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>
    <linearGradient id="runwayGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  
  <!-- Sky -->
  <rect width="600" height="230" fill="url(#skyGrad)" />
  
  <!-- Distant Andes Mountains -->
  <polygon points="0,200 90,130 180,180 270,120 380,190 490,110 600,190 600,230 0,230" fill="#94a3b8" opacity="0.6"/>
  <polygon points="40,210 140,150 240,210 330,160 450,210 560,140 600,180 600,230 0,230" fill="#64748b" opacity="0.8"/>
  
  <!-- Clouds -->
  <ellipse cx="120" cy="60" rx="45" ry="16" fill="#ffffff" opacity="0.8"/>
  <ellipse cx="140" cy="50" rx="30" ry="18" fill="#ffffff" opacity="0.9"/>
  <ellipse cx="440" cy="80" rx="55" ry="20" fill="#ffffff" opacity="0.8"/>

  <!-- Air Traffic Control Tower -->
  <rect x="60" y="85" width="24" height="125" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <polygon points="48,85 96,85 88,65 56,65" fill="#0284c7" stroke="#0369a1" stroke-width="2"/>
  <rect x="68" y="50" width="8" height="15" fill="#dc2626"/>

  <!-- Terminal Building in background -->
  <rect x="180" y="160" width="280" height="55" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <rect x="200" y="170" width="240" height="15" fill="#38bdf8" opacity="0.7"/>
  <text x="320" y="152" fill="#1e293b" font-size="12" font-family="sans-serif" font-weight="900" text-anchor="middle">AEROPUERTO INTERNACIONAL DE CUSCO</text>

  <!-- Commercial Jet Airplane -->
  <g transform="translate(360, 160)">
    <path d="M 0 35 L 140 30 L 190 10 L 200 28 L 150 40 L 110 44 L 10 42 Z" fill="#ffffff" stroke="#334155" stroke-width="2"/>
    <polygon points="70,36 10,65 30,68 95,37" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>
    <polygon points="170,18 190,0 205,0 190,20" fill="#ef4444"/>
    <circle cx="50" cy="34" r="2.5" fill="#1e293b"/>
    <circle cx="65" cy="34" r="2.5" fill="#1e293b"/>
    <circle cx="80" cy="34" r="2.5" fill="#1e293b"/>
    <circle cx="95" cy="34" r="2.5" fill="#1e293b"/>
    <circle cx="110" cy="34" r="2.5" fill="#1e293b"/>
    <circle cx="125" cy="34" r="2.5" fill="#1e293b"/>
  </g>

  <!-- Tarmac / Runway Ground -->
  <rect y="215" width="600" height="205" fill="url(#runwayGrad)" />
  <line x1="0" y1="320" x2="600" y2="320" stroke="#f8fafc" stroke-width="6" stroke-dasharray="35 25"/>
  <line x1="0" y1="260" x2="600" y2="260" stroke="#f59e0b" stroke-width="3"/>
  <line x1="0" y1="380" x2="600" y2="380" stroke="#f59e0b" stroke-width="3"/>
</svg>
